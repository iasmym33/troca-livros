<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Document</title>
</head>
<body>
    <main>

        <section class="sessao-imagem">
            <img src="img/imagem-login.png" alt="Amigas numa livraria">
        </section>

        <section class="sessao-login">

            <div class="area-titulo tt2">

                <h1>Conect <span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>

            </div>


            <form action="#" method="post" id="form-cadastro">

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Informe seu nome" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Informe seu email" required>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuário" required>

              <div class="senhas">

                <div>
                    <label for="senha"> Senha </label>
                    <input type="password" id="senha" placeholder="Informe uma senha" required>
                </div>

                <div>
                    <label for="confirmar-senha"> confirmar senha </label>
                    <input type="password" id="confirmar-senha" placeholder="Confirme a senha" required>
                </div>

              </div>

                

                <button id="btn-acessar">Cadastrar-se</button>
                <a href="login.html" id="nao-possui-conta">Já possuo uma conta. Acessar agora!</a>
               

            </form>

        </section>

    </main>
    
</body>
</html>
